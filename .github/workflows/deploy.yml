name: Validate and build Academia PAA PHUMA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate question bank and exam generator
        run: npm test
      - name: Audit curricular coverage by level
        run: npm run audit
      - name: Audit editorial quality and template diversity
        run: npm run audit:quality
      - name: Audit pilot game bank
        run: npm run audit:games
      - name: Build static website for Render
        run: npm run build
