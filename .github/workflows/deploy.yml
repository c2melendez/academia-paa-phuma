name: Validate and build Academia PAA PHUMA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate question bank and exam generator
        run: npm test
      - name: Audit curricular coverage by level
        run: npm run audit
      - name: Audit editorial quality and template diversity
        run: npm run audit:quality
      - name: Audit pilot game bank
        run: npm run audit:games
      - name: Reconcile M0 inventory and deficits
        run: npm run audit:m0
      - name: Exercise fail-closed M0 QA runner
        run: npm run qa:m0
      - name: Upload M0 verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-verification
          path: reports/*.json
          if-no-files-found: warn
      - name: Build static website for Render
        run: npm run build
